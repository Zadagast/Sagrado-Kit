# SagradoKit skin — Milk Redux + donor WonderLight/icons
format = "sagrado-skin"
version = 1

[meta]
name = "Milk Redux"
creator = "extracted from Hap"
description = "Art seed: buttons, popup, gel, tick/mutex, progress, WonderLight, icons"
